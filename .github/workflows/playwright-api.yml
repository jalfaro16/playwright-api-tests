name: Playwright API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      suite:
        description: 'Select test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - smoke
          - regression
          - positive
          - negative
          - all

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BOOKER_BASE_URL: ${{ secrets.BOOKER_BASE_URL }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        run: |
          case "${{ github.event.inputs.suite }}" in
            smoke)
              echo "Running smoke tests..."
              npx playwright test --grep @smoke
              ;;
            regression)
              echo "Running regression tests..."
              npx playwright test --grep @regression
              ;;
            positive)
              echo "Running positive tests..."
              npx playwright test tests/api/positiveTest
              ;;
            negative)
              echo "Running negative tests..."
              npx playwright test tests/api/negativeTest
              ;;
            *)
              echo "Running all tests..."
              npx playwright test
              ;;
          esac

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/